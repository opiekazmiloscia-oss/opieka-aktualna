<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oaza Spokoju - Globalny Komunikator</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-transparent m-0 p-0 pointer-events-none">

    <!-- ========================================== -->
    <!-- STARE ELEMENTY SCHOWANE W STRZAŁKI (Wstrzymane) -->
    <!-- ========================================== -->
    <!-- 
    <form id="stary-formularz-z-bledu" style="display:none;">
        <! -- Tutaj były stare, blokujące formularze -- >
    </form> 
    -->

    <!-- ========================================== -->
    <!-- NOWY, GLOBALNY KOMUNIKATOR (Działający)     -->
    <!-- ========================================== -->
    <div id="oaza-chat-container" class="fixed bottom-3 right-3 left-3 sm:left-auto sm:bottom-4 sm:right-4 z-50 font-sans pointer-events-auto flex flex-col items-center sm:items-end">
        
        <!-- Przycisk zwinięty -->
        <button
            id="oaza-chat-toggle-btn"
            onclick="toggleChat()"
            class="bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-600 hover:to-orange-700 text-white px-4 py-3 rounded-full shadow-2xl flex items-center space-x-2 border-2 border-white transition-all transform hover:scale-105 cursor-pointer ml-auto"
        >
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 animate-pulse" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
            </svg>
            <span class="text-xs font-black tracking-wider uppercase">Czat / Zapytanie</span>
        </button>

        <!-- Okno czatu -->
        <div id="oaza-chat-window" class="hidden w-full sm:w-96 bg-indigo-950 text-white rounded-3xl border-2 border-amber-400 shadow-2xl overflow-hidden transition-all duration-300 max-h-[85vh] flex flex-col mx-auto">
            
            <!-- Nagłówek czatu -->
            <div class="p-3.5 bg-indigo-950 flex items-center justify-between border-b border-indigo-800 shrink-0">
                <div class="flex items-center space-x-2">
                    <div class="w-7 h-7 rounded-full bg-amber-400 flex items-center justify-center text-indigo-950 font-black text-xs shadow">
                        🐾
                    </div>
                    <div>
                        <div class="font-bold text-xs flex items-center space-x-1.5">
                            <span>Oaza Spokoju Czat</span>
                            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                        </div>
                        <div class="text-[9px] text-amber-200">Tryb Globalny Aktywny</div>
                    </div>
                </div>
                <button 
                    onclick="toggleChat()"
                    class="text-amber-300 hover:text-white bg-indigo-900/80 p-1.5 rounded-xl border border-indigo-700 shadow cursor-pointer"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <!-- Treść i historia wiadomości -->
            <div class="p-4 space-y-3 bg-indigo-950/95 text-xs flex-1 flex flex-col justify-between overflow-hidden">
                <div id="chat-messages-box" class="space-y-2 overflow-y-auto pr-1 flex-1">
                    <div class="p-2.5 rounded-2xl max-w-[90%] leading-relaxed mr-auto bg-indigo-900 text-white border border-indigo-800 break-words whitespace-normal">
                        Witaj w Oazie Spokoju! 🐾 Wpisz swoją wiadomość poniżej – po wysłaniu zapytanie zostanie przekazane bezpośrednio do kontaktu.
                    </div>
                </div>

                <!-- Formularz wysyłania wiadomości -->
                <form id="chat-form" onsubmit="handleSendMessage(event)" class="space-y-2 pt-2 shrink-0">
                    <input 
                        type="text" 
                        id="chat-name"
                        placeholder="Twoje imię..." 
                        class="w-full bg-white text-gray-900 p-2.5 rounded-xl text-xs outline-none"
                        required
                    />
                    <div class="flex space-x-2">
                        <input 
                            type="text" 
                            id="chat-input"
                            placeholder="Treść zapytania..." 
                            class="flex-1 bg-white text-gray-900 p-2.5 rounded-xl text-xs outline-none"
                            required
                        />
                        <button 
                            type="submit"
                            class="bg-amber-500 hover:bg-amber-400 text-indigo-950 px-4 py-2.5 rounded-xl font-bold flex items-center justify-center shadow cursor-pointer"
                        >
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                            </svg>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Skrypty sterujące -->
    <script>
        let isChatOpen = false;

        function toggleChat() {
            isChatOpen = !isChatOpen;
            const chatWindow = document.getElementById('oaza-chat-window');
            const toggleBtn = document.getElementById('oaza-chat-toggle-btn');

            if (isChatOpen) {
                chatWindow.classList.remove('hidden');
                toggleBtn.classList.add('hidden');
            } else {
                chatWindow.classList.add('hidden');
                toggleBtn.classList.remove('hidden');
            }
        }

        function handleSendMessage(e) {
            e.preventDefault();
            const nameField = document.getElementById('chat-name');
            const inputField = document.getElementById('chat-input');
            const messagesBox = document.getElementById('chat-messages-box');
            
            const name = nameField.value.trim();
            const text = inputField.value.trim();

            if (!text || !name) return;

            // Wyświetlenie wiadomości lokalnie w oknie czatu
            const userMsgDiv = document.createElement('div');
            userMsgDiv.className = "p-2.5 rounded-2xl max-w-[90%] leading-relaxed ml-auto bg-amber-500 text-indigo-950 font-semibold break-words whitespace-normal";
            userMsgDiv.textContent = `${name}: ${text}`;
            messagesBox.appendChild(userMsgDiv);

            // Przygotowanie wiadomości na WhatsApp / powiadomienie
            const waText = `Nowe zapytanie z Oazy Spokoju:\nImię: ${name}\nTreść: ${text}`;
            const waUrl = `https://wa.me/48513557522?text=${encodeURIComponent(waText)}`;

            // Czyszczenie pól formularza
            nameField.value = '';
            inputField.value = '';
            messagesBox.scrollTop = messagesBox.scrollHeight;

            // Informacja zwrotna i otwarcie kanału kontaktu
            setTimeout(() => {
                const adminMsgDiv = document.createElement('div');
                adminMsgDiv.className = "p-2.5 rounded-2xl max-w-[90%] leading-relaxed mr-auto bg-indigo-900 text-white border border-indigo-800 break-words whitespace-normal";
                adminMsgDiv.textContent = "Oaza Spokoju: Wiadomość przyjęta! Otwieram kanał powiadomienia...";
                messagesBox.appendChild(adminMsgDiv);
                messagesBox.scrollTop = messagesBox.scrollHeight;

                // Otwieramy połączenie z Twoim numerem
                window.open(waUrl, '_blank');
            }, 800);
        }
    </script>
</body>
</html>
